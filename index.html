<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Periodic Table of Elements - All 118</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .search-box {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
        }
        
        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 1fr);
            gap: 6px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        
        .element {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: bold;
            text-align: center;
            padding: 8px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .element::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: left 0.5s;
            z-index: 1;
        }
        
        .element:hover::before {
            left: 100%;
        }
        
        .element:hover {
            transform: scale(1.15) translateY(-10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }
        
        .atomic-number {
            font-size: 11px;
            position: absolute;
            top: 3px;
            left: 3px;
            opacity: 0.8;
        }
        
        .symbol {
            font-size: 18px;
            font-weight: bold;
            margin: 2px 0;
            position: relative;
            z-index: 2;
        }
        
        .name {
            font-size: 9px;
            position: relative;
            z-index: 2;
        }
        
        .mass {
            font-size: 8px;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }
        
        /* Element Categories */
        .nonmetal { background: linear-gradient(135deg, #7cb342, #9ccc65); color: white; }
        .alkali-metal { background: linear-gradient(135deg, #ff6f00, #ffa726); color: white; }
        .alkaline-earth { background: linear-gradient(135deg, #fbc02d, #fdd835); color: #333; }
        .metalloid { background: linear-gradient(135deg, #00796b, #26a69a); color: white; }
        .halogen { background: linear-gradient(135deg, #c62828, #ef5350); color: white; }
        .noble-gas { background: linear-gradient(135deg, #4527a0, #6a1b9a); color: white; }
        .transition-metal { background: linear-gradient(135deg, #6d4c41, #a1887f); color: white; }
        .lanthanide { background: linear-gradient(135deg, #00897b, #00bcd4); color: white; }
        .actinide { background: linear-gradient(135deg, #d32f2f, #e53935); color: white; }
        .post-transition { background: linear-gradient(135deg, #455a64, #607d8b); color: white; }
        
        .legend {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .legend-box {
            width: 35px;
            height: 35px;
            border-radius: 5px;
            border: 2px solid rgba(0, 0, 0, 0.2);
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        .modal-close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #999;
        }
        
        .modal-close:hover {
            color: #333;
        }
        
        .modal h2 {
            margin-top: 10px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .modal-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .info-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9em;
        }
        
        .info-item strong {
            display: block;
            color: #667eea;
            margin-bottom: 5px;
        }
    </style>
</head>

        const table = document.getElementById('periodicTable');
        const modal = document.getElementById('modal');
        const modalClose = document.getElementById('modalClose');
        const searchBox = document.getElementById('searchBox');
        
        function createElementDiv(el) {
            const div = document.createElement('div');
            div.className = 'element ' + el.c;
            div.style.gridColumn = el.g;
            div.style.gridRow = el.p + 1;
            div.innerHTML = '<span class="atomic-number">' + el.n + '</span>' +
                            '<span class="symbol">' + el.s + '</span>' +
                            '<span class="name">' + el.na + '</span>' +
                            '<span class="mass">' + el.m + '</span>';
            div.onclick = () => showModal(el);
            return div;
        }
        
        function renderTable(elementList) {
            table.innerHTML = '';
            elementList.forEach(el => table.appendChild(createElementDiv(el)));
        }
        
        function showModal(el) {
            document.getElementById('modalTitle').innerText = el.na + ' (' + el.s + ')';
            document.getElementById('modalBody').innerHTML = 
                '<div class="modal-info">' +
                '<div class="info-item"><strong>Atomic Number:</strong>' + el.n + '</div>' +
                '<div class="info-item"><strong>Atomic Mass:</strong>' + el.m + '</div>' +
                '<div class="info-item"><strong>Period:</strong>' + el.p + '</div>' +
                '<div class="info-item"><strong>Group:</strong>' + el.g + '</div>' +
                '<div class="info-item"><strong>Category:</strong>' + el.c.replace('-', ' ').toUpperCase() + '</div>' +
                '<div class="info-item"><strong>Symbol:</strong>' + el.s + '</div>' +
                '</div>';
            modal.classList.add('active');
        }
        
        modalClose.onclick = () => modal.classList.remove('active');
        modal.onclick = (e) => {
            if (e.target === modal) modal.classList.remove('active');
        };
        
        searchBox.oninput = (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = elements.filter(el => 
                el.na.toLowerCase().includes(query) ||
                el.s.toLowerCase().includes(query) ||
                el.n.toString().includes(query)
            );
            renderTable(filtered);
        };
        
        renderTable(elements);
    </script>
</body>
